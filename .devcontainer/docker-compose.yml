services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/typescript-node:24

    volumes:
      - ..:/workspaces/outdated-plus:cached
      - ${HOME}/.zshrc:/home/node/.zshrc.local:ro
      - ${HOME}/.p10k.zsh:/home/node/.p10k.zsh:ro
      - ${HOME}/.zsh_history:/home/node/.zsh_history
      # Claude Code configuration persistence
      - ${HOME}/.claude:/home/node/.claude:cached
      - ${HOME}/.config/claude:/home/node/.config/claude:cached
      # Claude Code writes .claude.json atomically (write temp file + rename),
      # which breaks single-file bind mounts. The file is mounted as a seed and
      # copied to ~/.claude.json once by post-create-command.sh.
      - ${HOME}/.claude.json:/home/node/.claude.json.seed:ro

    command: sleep infinity

    environment:
      - NODE_ENV=development
